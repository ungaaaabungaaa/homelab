name: Verify local monitor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python tools/acceptance.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 90
      - name: Actual container health, persistence and restore
        run: |
          curl --fail http://127.0.0.1:8086/healthz
          curl --fail http://127.0.0.1:8086/metrics
          docker compose exec -T monitor python /app/homelab.py backup --data /data --out /tmp/snapshot
          docker compose exec -T monitor python /app/homelab.py restore --backup /tmp/snapshot --data /tmp/restored
          docker compose exec -T monitor python -c "import sys; sys.path.insert(0,'/app'); import homelab; assert homelab.history(__import__('pathlib').Path('/tmp/restored'))"
          docker compose restart monitor
          sleep 2
          curl --fail http://127.0.0.1:8086/healthz
          docker compose exec -T monitor python -c "import sys; sys.path.insert(0,'/app'); import homelab; assert len(homelab.history(__import__('pathlib').Path('/data'))) >= 2"
      - if: always()
        run: docker compose logs && docker compose down --volumes
